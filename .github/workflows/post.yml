name: post

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: render but do not publish or claim'
        type: boolean
        default: false
      post_now:
        description: 'Post one video now, whatever the schedule says'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uploader
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DRIVE_ROOT_ID: ${{ secrets.DRIVE_ROOT_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      POST_NOW: ${{ inputs.post_now && github.run_id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - run: go build -trimpath -ldflags=-s -o uploader .
      - id: due
        run: |
          out=$(./uploader due)
          echo "$out"
          if [ "$out" = due ] || [ -n "$POST_NOW" ]; then echo "due=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.due.outputs.due == 'yes'
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/apt.sh') }}
      - if: steps.due.outputs.due == 'yes'
        run: sh .github/apt.sh
      # saved right away (not at job end) so a failed publish still keeps the cache
      - if: steps.due.outputs.due == 'yes' && steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/apt.sh') }}
      - if: steps.due.outputs.due == 'yes'
        run: ./uploader tick
