name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - run: go vet ./...
      - run: go test ./...
      - id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/apt.sh') }}
      - run: sh .github/apt.sh
      - if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/apt.sh') }}
      - run: mkdir -p "$RUNNER_TEMP/frames"
      - run: go test -tags ffmpeg -run TestRenderReal -v ./...
        env:
          FRAME_DIR: ${{ runner.temp }}/frames
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emoji-frame
          path: ${{ runner.temp }}/frames/frame.png
