[project]
name = "tts"
version = "0.1.0"
description = "Kokoro-82M text-to-speech CLI with exact word timings"
requires-python = "==3.12.*"
dependencies = [
  "kokoro==0.9.4",
  "soundfile==0.13.1",
  "numpy==2.2.6",
  "torch==2.8.0",
  "en-core-web-sm",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
markers = ["slow: runs the real model"]
